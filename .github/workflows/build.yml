name: Build Project PHOENIX

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: phoenixmobile-dev-jar
          path: build/libs/*.jar
